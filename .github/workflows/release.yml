# TestFlight release via Fastlane (lane :beta).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_KEY_ID       — App Store Connect API key ID (e.g. ABC123DE45)
#   APPSTORE_ISSUER_ID    — App Store Connect API issuer ID (UUID)
#   APPSTORE_KEY_CONTENT  — full contents of the AuthKey_XXXX.p8 file (multi-line, paste as-is)
#
# Signing is fully cloud-managed: export_options signingStyle=automatic +
# -allowProvisioningUpdates + the API key means Apple issues/reuses a
# distribution certificate — no .p12/profile secrets to rotate.

name: Release (TestFlight)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta:
    name: Upload to TestFlight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        run: brew install tuist

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        run: |
          printf '%s' "$APPSTORE_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPSTORE_KEY_CONTENT: ${{ secrets.APPSTORE_KEY_CONTENT }}

      - name: Fastlane beta
        run: bundle exec fastlane beta
        env:
          CI: "true"
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          AUTH_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
